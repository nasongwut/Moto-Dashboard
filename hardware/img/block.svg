<rect width="1210" height="570" fill="#0B0D10"/>
<text x="30" y="42" fill="#F2F4F7" font-size="24" font-weight="bold">MotoDash Hub — System block diagram</text><text x="30" y="66" fill="#AEB7C2" font-size="13">One USB-C cable to the phone: charging + 2 analog cameras + multi-brand OBD</text><rect x="30" y="110" width="190" height="70" rx="10" fill="#12161B" stroke="#FFB020" stroke-width="2"/><text x="125.0" y="137.0" fill="#F2F4F7" font-size="15" font-weight="bold" text-anchor="middle">Vehicle 12 V</text><text x="125.0" y="157.0" fill="#AEB7C2" font-size="12" text-anchor="middle">ACC (ignition) + GND</text><text x="125.0" y="172.0" fill="#AEB7C2" font-size="12" text-anchor="middle">9–16 V, load-dump</text><rect x="30" y="230" width="190" height="70" rx="10" fill="#12161B" stroke="#4FC3F7" stroke-width="2"/><text x="125.0" y="257.0" fill="#F2F4F7" font-size="15" font-weight="bold" text-anchor="middle">AHD camera 1</text><text x="125.0" y="277.0" fill="#AEB7C2" font-size="12" text-anchor="middle">front · 720p/1080p</text><text x="125.0" y="292.0" fill="#AEB7C2" font-size="12" text-anchor="middle">12 V, coax video</text><rect x="30" y="320" width="190" height="70" rx="10" fill="#12161B" stroke="#4FC3F7" stroke-width="2"/><text x="125.0" y="347.0" fill="#F2F4F7" font-size="15" font-weight="bold" text-anchor="middle">AHD camera 2</text><text x="125.0" y="367.0" fill="#AEB7C2" font-size="12" text-anchor="middle">rear · 720p/1080p</text><text x="125.0" y="382.0" fill="#AEB7C2" font-size="12" text-anchor="middle">12 V, coax video</text><rect x="30" y="430" width="190" height="90" rx="10" fill="#12161B" stroke="#7CE38B" stroke-width="2"/><text x="125.0" y="467.0" fill="#F2F4F7" font-size="15" font-weight="bold" text-anchor="middle">Vehicle diag port</text><text x="125.0" y="487.0" fill="#AEB7C2" font-size="12" text-anchor="middle">OBD2-16 / Yamaha 4p /</text><text x="125.0" y="502.0" fill="#AEB7C2" font-size="12" text-anchor="middle">Honda / Kawasaki / Suzuki</text><text x="125.0" y="517.0" fill="#AEB7C2" font-size="12" text-anchor="middle">via adapter cable</text><rect x="260" y="95" width="700" height="450" rx="16" fill="none" stroke="#FFB020" stroke-width="2" stroke-dasharray="10 6"/><text x="276" y="118" fill="#FFB020" font-size="13" font-weight="bold">MotoDash Hub PCB (100 × 70 mm, 4-layer)</text><rect x="290" y="130" width="200" height="80" rx="10" fill="#12161B" stroke="#FFB020" stroke-width="2"/><text x="390.0" y="162.0" fill="#F2F4F7" font-size="15" font-weight="bold" text-anchor="middle">Input protection</text><text x="390.0" y="182.0" fill="#AEB7C2" font-size="12" text-anchor="middle">fuse · TVS · reverse-polarity</text><text x="390.0" y="197.0" fill="#AEB7C2" font-size="12" text-anchor="middle">ideal diode (LM74700-Q1)</text><rect x="530" y="130" width="180" height="80" rx="10" fill="#12161B" stroke="#FFB020" stroke-width="2"/><text x="620.0" y="162.0" fill="#F2F4F7" font-size="15" font-weight="bold" text-anchor="middle">Buck 12→5 V 6 A</text><text x="620.0" y="182.0" fill="#AEB7C2" font-size="12" text-anchor="middle">LM61460-Q1</text><text x="620.0" y="197.0" fill="#AEB7C2" font-size="12" text-anchor="middle">+ LDO 3.3 V</text><rect x="290" y="240" width="200" height="60" rx="10" fill="#12161B" stroke="#FFB020" stroke-width="2"/><text x="390.0" y="262.0" fill="#F2F4F7" font-size="14" font-weight="bold" text-anchor="middle">Camera power 12 V</text><text x="390.0" y="282.0" fill="#AEB7C2" font-size="12" text-anchor="middle">polyfuse + LC filter ×2</text><rect x="530" y="232" width="180" height="76" rx="10" fill="#12161B" stroke="#4FC3F7" stroke-width="2"/><text x="620.0" y="262.0" fill="#F2F4F7" font-size="15" font-weight="bold" text-anchor="middle">AHD→USB UVC ×2</text><text x="620.0" y="282.0" fill="#AEB7C2" font-size="12" text-anchor="middle">capture modules</text><text x="620.0" y="297.0" fill="#AEB7C2" font-size="12" text-anchor="middle">MJPEG 720p/1080p</text><rect x="290" y="420" width="200" height="100" rx="10" fill="#12161B" stroke="#7CE38B" stroke-width="2"/><tex