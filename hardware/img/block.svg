ext x="510.0" y="464.0" fill="#7CE38B" font-size="11" text-anchor="middle">UART</text><path d="M 710 470 L 840 470 L 840 390" fill="none" stroke="#7CE38B" stroke-width="2.5" marker-end="url(#aG)"/><line x1="930" y1="190" x2="1010" y2="260" stroke="#FFB020" stroke-width="2.5" marker-end="url(#aA)"/><text x="1000" y="200" fill="#FFB020" font-size="11" text-anchor="middle">VBUS 5 V · CC</text><line x1="930" y1="340" x2="1010" y2="310" stroke="#AEB7C2" stroke-width="2.5" marker-end="url(#a)"/><text x="968" y="345" fill="#AEB7C2" font-size="11" text-anchor="middle">USB D+/D−</text><path d="M 840 290 L 840 240" fill="none" stroke="#AEB7C2" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="1010" y1="420" x2="1038" y2="420" stroke="#FFB020" stroke-width="3"/><text x="1046" y="424" fill="#AEB7C2" font-size="12">power</text><line x1="1010" y1="440" x2="1038" y2="440" stroke="#4FC3F7" stroke-width="3"/><text x="1046" y="444" fill="#AEB7C2" font-size="12">video</text><line x1="1010" y1="460" x2="1038" y2="460" stroke="#7CE38B" stroke-width="3"/><text x="1046" y="464" fill="#AEB7C2" font-size="12">OBD / diagnostics</text><line x1="1010" y1="480" x2="1038" y2="480" stroke="#AEB7C2" stroke-width="3"/><text x="1046" y="484" fill="#AEB7C2" font-size="12">USB data</text>
